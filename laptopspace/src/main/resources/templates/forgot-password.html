<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Quên mật khẩu - LaptopSpace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg border border-gray-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-[#003f87]">LaptopSpace</h1>
            <p class="text-gray-500 mt-2">Khôi phục mật khẩu tài khoản</p>
        </div>

        <div th:if="${error}" class="mb-4 p-3 bg-red-50 text-red-600 rounded-lg text-sm font-medium text-center" th:text="${error}"></div>

        <form th:action="@{/forgot-password}" method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Nhập Email đăng ký</label>
                <input type="email" name="email" required placeholder="vidu@gmail.com" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-[#003f87] outline-none">
            </div>
            
            <button type="submit" class="w-full py-3 bg-[#fe6500] text-white font-bold rounded-xl hover:bg-[#a33e00] transition shadow-md">
                CẤP LẠI MẬT KHẨU
            </button>
        </form>

        <div class="mt-6 text-center text-sm">
            <a th:href="@{/login}" class="text-[#003f87] font-semibold hover:underline">Quay lại đăng nhập</a>
        </div>
    </div>

</body>
</html>
