<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Đăng nhập - LaptopSpace</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff", "error": "#ba1a1a", "surface-container-low": "#f3f4f5",
                        "secondary-fixed": "#ffdbcd", "secondary-container": "#fe6500", "on-primary-container": "#bbd0ff",
                        "on-tertiary-fixed-variant": "#7b2f00", "on-error-container": "#93000a", "primary-fixed": "#d7e2ff",
                        "tertiary-fixed": "#ffdbcc", "tertiary-container": "#983c00", "inverse-primary": "#acc7ff",
                        "on-tertiary-fixed": "#351000", "on-surface-variant": "#424752", "on-surface": "#191c1d",
                        "on-secondary": "#ffffff", "outline": "#727784", "on-background": "#191c1d", "surface-bright": "#f8f9fa",
                        "outline-variant": "#c2c6d4", "primary-fixed-dim": "#acc7ff", "on-secondary-fixed": "#360f00",
                        "on-primary-fixed-variant": "#004491", "tertiary": "#722b00", "tertiary-fixed-dim": "#ffb694",
                        "surface-variant": "#e1e3e4", "primary": "#003f87", "error-container": "#ffdad6", "background": "#f8f9fa",
                        "surface-container": "#edeeef", "on-primary": "#ffffff", "on-secondary-container": "#541d00",
                        "inverse-surface": "#2e3132", "secondary-fixed-dim": "#ffb596", "on-tertiary": "#ffffff",
                        "surface-tint": "#115cb9", "surface-container-highest": "#e1e3e4", "surface": "#f8f9fa",
                        "on-primary-fixed": "#001a40", "surface-container-high": "#e7e8e9", "primary-container": "#0056b3",
                        "inverse-on-surface": "#f0f1f2", "on-secondary-fixed-variant": "#7c2e00", "secondary": "#a33e00",
                        "surface-dim": "#d9dadb", "on-tertiary-container": "#ffc2a7", "on-error": "#ffffff"
                    },
                    "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" },
                    "spacing": { "margin-desktop": "48px", "stack-xs": "4px", "margin-mobile": "16px", "stack-md": "16px", "stack-xl": "48px", "stack-sm": "8px", "gutter": "24px", "stack-lg": "24px", "container-max": "1240px" },
                    "fontFamily": { "display-lg": ["Inter"], "body-sm": ["Inter"], "body-md": ["Inter"], "headline-lg-mobile": ["Inter"], "label-md": ["Inter"], "headline-md": ["Inter"], "headline-sm": ["Inter"], "headline-lg": ["Inter"], "label-lg": ["Inter"], "body-lg": ["Inter"], "price-lg": ["Inter"] },
                    "fontSize": { "display-lg": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }], "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }], "headline-lg-mobile": ["24px", { "lineHeight": "1.3", "fontWeight": "700" }], "label-md": ["12px", { "lineHeight": "1", "fontWeight": "500" }], "headline-md": ["24px", { "lineHeight": "1.4", "fontWeight": "600" }], "headline-sm": ["20px", { "lineHeight": "1.4", "fontWeight": "600" }], "headline-lg": ["32px", { "lineHeight": "1.3", "fontWeight": "700" }], "label-lg": ["14px", { "lineHeight": "1", "fontWeight": "600" }], "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }], "price-lg": ["24px", { "lineHeight": "1", "fontWeight": "700" }] }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col justify-center items-center p-margin-mobile">

    <div class="w-full max-w-[420px] bg-surface-container-lowest rounded-xl border border-outline-variant p-margin-mobile md:p-stack-lg shadow-sm">
        
        <div class="text-center mb-stack-lg">
            <h1 class="font-headline-lg-mobile md:font-headline-md text-headline-lg-mobile md:text-headline-md text-on-surface mb-stack-xs">Đăng nhập</h1>
            <p class="font-body-sm text-body-sm text-on-surface-variant">Chào mừng trở lại! Vui lòng nhập thông tin của bạn.</p>
        </div>

        <div th:if="${param.error}" class="bg-red-100 text-red-700 p-3 rounded-lg mb-4 text-sm text-center font-medium">
            Tài khoản hoặc mật khẩu không chính xác!
        </div>
        
        <div th:if="${param.registered}" class="bg-green-100 text-green-700 p-3 rounded-lg mb-4 text-sm text-center font-medium">
            Đăng ký thành công! Vui lòng đăng nhập.
        </div>

        <form th:action="@{/login}" class="flex flex-col gap-stack-md" method="POST">
            <div class="flex flex-col gap-stack-xs">
                <label class="font-label-md text-label-md text-on-surface" for="email_phone">Email hoặc Số điện thoại</label>
                <input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="email_phone" name="username" placeholder="Nhập email hoặc số điện thoại" required type="text"/>
            </div>
            
            <div class="flex flex-col gap-stack-xs">
                <div class="flex items-center justify-between">
                    <label class="font-label-md text-label-md text-on-surface" for="password">Mật khẩu</label>
                    <a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" th:href="@{/forgot-password}">Quên mật khẩu?</a>
                </div>
                <div class="relative">
                    <input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" name="password" placeholder="Nhập mật khẩu" required type="password"/>
                </div>
            </div>
            
            <button class="w-full mt-stack-sm bg-[#003f87] text-white py-3 rounded-lg font-label-lg text-label-lg font-bold hover:bg-blue-800 transition-colors active:scale-95 flex justify-center items-center" type="submit">
                Đăng nhập
            </button>
        </form>

        <div class="mt-stack-lg text-center font-body-sm text-body-sm text-on-surface-variant">
            Chưa có tài khoản? <a class="text-primary font-bold hover:underline transition-all" th:href="@{/register}">Đăng ký ngay</a>
        </div>
    </div>

</body>
</html>
