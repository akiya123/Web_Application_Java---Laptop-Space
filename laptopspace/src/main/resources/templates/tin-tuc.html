<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    
    <title>Đang cập nhật - LaptopSpace</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    
    <style> 
        body { font-family: 'Inter', sans-serif; } 
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen text-gray-800">

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="flex-grow flex items-center justify-center py-20 px-4">
        <div class="text-center bg-white p-10 md:p-16 rounded-3xl shadow-sm border border-gray-200 max-w-lg w-full">
            
            <div class="w-24 h-24 bg-blue-50 text-[#003f87] rounded-full flex items-center justify-center mx-auto mb-6">
                <span class="material-symbols-outlined text-[48px]">construction</span>
            </div>
            
            <h1 class="text-2xl md:text-3xl font-black text-gray-800 mb-4">Trang đang được xây dựng!</h1>
            
            <p class="text-gray-500 font-medium mb-8">
                Nội dung của trang này đang được đội ngũ Admin cập nhật. Bạn vui lòng quay lại sau nhé!
            </p>
            
            <a th:href="@{/}" class="inline-flex items-center justify-center gap-2 px-8 py-3 bg-[#003f87] text-white font-bold rounded-xl hover:bg-blue-800 transition shadow-md hover:shadow-lg">
                <span class="material-symbols-outlined text-[20px]">home</span>
                Về Trang Chủ
            </a>
            
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
