<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thanh toán đơn hàng - LaptopSpace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-8 text-center">
        <h1 class="text-2xl font-bold text-[#003f87] mb-2">Thanh toán chuyển khoản</h1>
        <p class="text-gray-500 text-sm mb-6">Quét mã QR dưới đây bằng App Ngân hàng hoặc Momo</p>

        <div class="bg-gray-100 p-4 rounded-xl inline-block mb-6 border border-gray-200">
            <img th:src="@{'https://img.vietqr.io/image/mbbank-0974915205-compact2.png?amount=' + ${#numbers.formatInteger(order.totalAmount, 0)} + '&addInfo=Thanh toan don hang ' + ${order.id} + '&accountName=NGUYEN GIA KHIEM'}" 
                 class="w-64 h-64 object-contain rounded-lg" alt="QR Code">
        </div>

        <div class="space-y-2 mb-8 text-left bg-blue-50 p-4 rounded-lg border border-blue-100 text-sm">
            <div class="flex justify-between"><span class="text-gray-600">Mã đơn hàng:</span> <strong class="text-gray-900" th:text="'#' + ${order.id}"></strong></div>
            <div class="flex justify-between"><span class="text-gray-600">Số tiền:</span> <strong class="text-red-600 text-lg" th:text="${#numbers.formatInteger(order.totalAmount, 3, 'POINT')} + ' ₫'"></strong></div>
            <div class="flex justify-between"><span class="text-gray-600">Nội dung CK:</span> <strong class="text-gray-900" th:text="'Thanh toan don hang ' + ${order.id}"></strong></div>
        </div>

        <a th:href="@{/payment/success/{id}(id=${order.id})}" 
           class="block w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl transition duration-200 shadow-md">
            TÔI ĐÃ CHUYỂN KHOẢN XONG
        </a>
        
        <p class="text-xs text-gray-400 mt-4 italic">* Hệ thống sẽ tự động xác nhận sau 1-2 phút. Nếu đồ án thì thầy cô bấm nút trên để qua bước nha!</p>
    </div>

</body>
</html>
