<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm Laptop mới - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden">

   <div th:replace="~{admin/fragments/sidebar :: sidebar('laptops')}"></div>

    <main class="flex-1 overflow-y-auto p-8">
        <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-8 border-b pb-4">Đăng sản phẩm mới</h2>

            <form th:action="@{/admin/laptops/save}" method="POST" enctype="multipart/form-data" class="space-y-8">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="flex flex-col gap-1.5">
                        <label class="font-semibold text-sm">Tên Laptop *</label>
                        <input name="name" required class="border-gray-300 rounded-lg focus:ring-[#003f87] px-4 py-2.5" type="text" placeholder="VD: ASUS ROG Strix G16"/>
                    </div>
					<div class="flex flex-col gap-1.5">
                        <label class="font-semibold text-sm text-orange-600">Mã nhóm máy (Tùy chọn)</label>
                        <input name="modelGroup" class="border-orange-300 bg-orange-50 rounded-lg focus:ring-orange-500 text-sm px-4 py-2.5" type="text" placeholder="VD: DELL_PRECISION_7550 (Viết hoa không dấu)"/>
					    <p class="text-[11px] text-gray-500">Các máy có cùng Mã Nhóm sẽ tự động liên kết với nhau ở trang Chi tiết.</p>
					</div>
                    <div class="flex flex-col gap-1.5">
                        <label class="font-semibold text-sm">Danh mục *</label>
                        <select name="category.id" class="border-gray-300 rounded-lg px-4 py-2.5">
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Gaming</option>
                        </select>
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="font-semibold text-sm">Giá gốc *</label>
                        <input name="price" type="number" required class="border-gray-300 rounded-lg px-4 py-2.5" placeholder="VNĐ"/>
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="font-semibold text-sm">Giá khuyến mãi</label>
                        <input name="discountPrice" type="number" class="border-gray-300 rounded-lg px-4 py-2.5" placeholder="VNĐ"/>
                    </div>
                </div>

                <div class="bg-gray-50 p-6 rounded-xl border border-gray-200">
                    <h3 class="font-bold text-gray-700 mb-5 flex items-center gap-2"><span class="material-symbols-outlined">memory</span> Thông số kỹ thuật</h3>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-5">
                        <div class="flex flex-col gap-1">
                            <label class="text-xs font-bold text-gray-600 uppercase">CPU</label>
                            <input name="cpu" class="border-gray-300 rounded-lg text-sm px-3 py-2.5" placeholder="Intel Core i7-13650HX..."/>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-xs font-bold text-gray-600 uppercase">RAM</label>
                            <input name="ram" class="border-gray-300 rounded-lg text-sm px-3 py-2.5" placeholder="16GB DDR5..."/>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-xs font-bold text-gray-600 uppercase">Ổ cứng</label>
                            <input name="storage" class="border-gray-300 rounded-lg text-sm px-3 py-2.5" placeholder="512GB SSD PCIe..."/>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-xs font-bold text-gray-600 uppercase">VGA</label>
                            <input name="vga" class="border-gray-300 rounded-lg text-sm px-3 py-2.5" placeholder="NVIDIA RTX 4050..."/>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-xs font-bold text-gray-600 uppercase">Màn hình</label>
                            <input name="screen" class="border-gray-300 rounded-lg text-sm px-3 py-2.5" placeholder="16'' WUXGA 165Hz..."/>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-xs font-bold text-gray-600 uppercase">Hệ điều hành</label>
                            <input name="operatingSystem" class="border-gray-300 rounded-lg text-sm px-3 py-2.5" placeholder="Windows 11..."/>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-xs font-bold text-gray-600 uppercase">Webcam</label>
                            <input name="webcam" class="border-gray-300 rounded-lg text-sm px-3 py-2.5" placeholder="720p HD..."/>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-xs font-bold text-gray-600 uppercase">Pin</label>
                            <input name="battery" class="border-gray-300 rounded-lg text-sm px-3 py-2.5" placeholder="4-cell, 90 Wh..."/>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-xs font-bold text-gray-600 uppercase">Trọng lượng</label>
                            <input name="weight" class="border-gray-300 rounded-lg text-sm px-3 py-2.5" placeholder="2.5 kg..."/>
                        </div>
                        <div class="flex flex-col gap-1 md:col-span-2">
                            <label class="text-xs font-bold text-gray-600 uppercase">Cổng kết nối</label>
                            <textarea name="ports" rows="3" class="border-gray-300 rounded-lg text-sm px-3 py-2.5" placeholder="1x Thunderbolt 4&#10;2x USB 3.2..."></textarea>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-xs font-bold text-gray-600 uppercase">Tồn kho *</label>
                            <input name="stockQuantity" type="number" required class="border-gray-300 rounded-lg text-sm px-3 py-2.5" value="10"/>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <div class="flex flex-col gap-1.5">
                            <label class="font-semibold text-sm">Tính năng nổi bật (Ngắn gọn)</label>
                            <textarea name="keyFeatures" rows="3" class="border-gray-300 rounded-lg text-sm px-4 py-2.5" placeholder="- Tản nhiệt xịn&#10;- Màn hình đẹp..."></textarea>
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <label class="font-semibold text-sm">Mô tả chi tiết</label>
                            <textarea name="description" rows="4" class="border-gray-300 rounded-lg text-sm px-4 py-2.5" placeholder="Nhập bài viết mô tả sản phẩm..."></textarea>
                        </div>
                    </div>
                    
                    <div class="space-y-6">
                        <div class="flex flex-col gap-2 p-5 border border-orange-200 bg-orange-50 rounded-xl">
                            <label class="font-bold text-sm text-orange-700">Ảnh đại diện (Thumbnail) *</label>
                            <input name="mainImage" type="file" required accept="image/*" class="text-sm file:mr-4 file:py-2.5 file:px-4 file:rounded-md file:border-0 file:bg-white file:text-orange-700 file:font-semibold hover:file:bg-gray-100 cursor-pointer"/>
                        </div>
                        <div class="flex flex-col gap-2 p-5 border border-blue-200 bg-blue-50 rounded-xl">
                            <label class="font-bold text-sm text-blue-700">Thư viện ảnh phụ (Gallery)</label>
                            <p class="text-xs text-blue-600 mb-1">Có thể chọn nhiều ảnh cùng lúc</p>
                            <input name="extraImages" type="file" multiple accept="image/*" class="text-sm file:mr-4 file:py-2.5 file:px-4 file:rounded-md file:border-0 file:bg-white file:text-blue-700 file:font-semibold hover:file:bg-gray-100 cursor-pointer"/>
                        </div>
                    </div>
                </div>

                <div class="pt-6 border-t border-gray-200 flex justify-end gap-4">
                    <a th:href="@{/admin/laptops}" class="px-6 py-2.5 border border-gray-300 text-gray-700 rounded-lg font-bold hover:bg-gray-50 transition">Hủy</a>
                    <button type="submit" class="px-8 py-2.5 bg-[#003f87] text-white rounded-lg font-bold hover:bg-blue-800 transition shadow-md">LƯU SẢN PHẨM</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
