<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cập nhật Sản phẩm - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden text-gray-800">

    <div th:replace="~{admin/fragments/sidebar :: sidebar('laptops')}"></div>

    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="h-20 bg-white border-b border-gray-200 flex items-center px-8 shrink-0 shadow-sm gap-4">
            <a th:href="@{/admin/laptops}" class="text-gray-500 hover:text-[#003f87] transition flex items-center">
                <span class="material-symbols-outlined">arrow_back</span>
            </a>
            <h1 class="text-xl font-bold text-gray-800">Cập nhật Sản Phẩm</h1>
        </header>

        <div class="flex-1 overflow-y-auto p-8">
            <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
                
                <form th:action="@{/admin/laptops/edit/{id}(id=${laptop.id})}" th:object="${laptop}" method="POST" enctype="multipart/form-data" class="space-y-8">
                    
                    <input type="hidden" th:field="*{id}">

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="flex flex-col gap-1.5">
                            <label class="font-semibold text-sm">Tên Laptop *</label>
                            <input th:field="*{name}" required class="border-gray-300 rounded-lg focus:ring-[#003f87] px-4 py-2.5" type="text">
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <label class="font-semibold text-sm text-orange-600">Mã nhóm máy (Tùy chọn)</label>
                            <input th:field="*{modelGroup}" class="border-orange-300 bg-orange-50 rounded-lg focus:ring-orange-500 text-sm px-4 py-2.5" type="text" placeholder="VD: DELL_PRECISION_7550">
                            <p class="text-[11px] text-gray-500">Các máy có cùng Mã Nhóm sẽ tự động liên kết với nhau ở trang Chi tiết.</p>
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <label class="font-semibold text-sm">Danh mục *</label>
                            <select th:field="*{category.id}" required class="border-gray-300 rounded-lg px-4 py-2.5">
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                            </select>
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <label class="font-semibold text-sm">Giá gốc *</label>
                            <input name="price" id="price" type="number" required 
                                   th:value="${laptop.price != null ? laptop.price.longValue() : ''}" 
                                   class="border-gray-300 rounded-lg px-4 py-2.5" placeholder="VNĐ"/>
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <label class="font-semibold text-sm">Giá khuyến mãi</label>
                            <input name="discountPrice" id="discountPrice" type="number" 
                                   th:value="${laptop.discountPrice != null ? laptop.discountPrice.longValue() : ''}" 
                                   class="border-gray-300 rounded-lg px-4 py-2.5" placeholder="VNĐ"/>
                        </div>
                    </div>

                    <div class="bg-gray-50 p-6 rounded-xl border border-gray-200">
                        <h3 class="font-bold text-gray-700 mb-5 flex items-center gap-2"><span class="material-symbols-outlined">memory</span> Thông số kỹ thuật</h3>
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-5">
                            <div class="flex flex-col gap-1">
                                <label class="text-xs font-bold text-gray-600 uppercase">CPU</label>
                                <input th:field="*{cpu}" class="border-gray-300 rounded-lg text-sm px-3 py-2.5"/>
                            </div>
                            <div class="flex flex-col gap-1">
                                <label class="text-xs font-bold text-gray-600 uppercase">RAM</label>
                                <input th:field="*{ram}" class="border-gray-300 rounded-lg text-sm px-3 py-2.5"/>
                            </div>
                            <div class="flex flex-col gap-1">
                                <label class="text-xs font-bold text-gray-600 uppercase">Ổ cứng</label>
                                <input th:field="*{storage}" class="border-gray-300 rounded-lg text-sm px-3 py-2.5"/>
                            </div>
                            <div class="flex flex-col gap-1">
                                <label class="text-xs font-bold text-gray-600 uppercase">VGA</label>
                                <input th:field="*{vga}" class="border-gray-300 rounded-lg text-sm px-3 py-2.5"/>
                            </div>
                            <div class="flex flex-col gap-1">
                                <label class="text-xs font-bold text-gray-600 uppercase">Màn hình</label>
                                <input th:field="*{screen}" class="border-gray-300 rounded-lg text-sm px-3 py-2.5"/>
                            </div>
                            <div class="flex flex-col gap-1">
                                <label class="text-xs font-bold text-gray-600 uppercase">Hệ điều hành</label>
                                <input th:field="*{operatingSystem}" class="border-gray-300 rounded-lg text-sm px-3 py-2.5"/>
                            </div>
                            <div class="flex flex-col gap-1">
                                <label class="text-xs font-bold text-gray-600 uppercase">Webcam</label>
                                <input th:field="*{webcam}" class="border-gray-300 rounded-lg text-sm px-3 py-2.5"/>
                            </div>
                            <div class="flex flex-col gap-1">
                                <label class="text-xs font-bold text-gray-600 uppercase">Pin</label>
                                <input th:field="*{battery}" class="border-gray-300 rounded-lg text-sm px-3 py-2.5"/>
                            </div>
                            <div class="flex flex-col gap-1">
                                <label class="text-xs font-bold text-gray-600 uppercase">Trọng lượng</label>
                                <input th:field="*{weight}" class="border-gray-300 rounded-lg text-sm px-3 py-2.5"/>
                            </div>
                            <div class="flex flex-col gap-1 md:col-span-2">
                                <label class="text-xs font-bold text-gray-600 uppercase">Cổng kết nối</label>
                                <textarea th:field="*{ports}" rows="3" class="border-gray-300 rounded-lg text-sm px-3 py-2.5"></textarea>
                            </div>
                            <div class="flex flex-col gap-1">
                                <label class="text-xs font-bold text-gray-600 uppercase">Tồn kho *</label>
                                <input th:field="*{stockQuantity}" type="number" required class="border-gray-300 rounded-lg text-sm px-3 py-2.5"/>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-4">
                            <div class="flex flex-col gap-1.5">
                                <label class="font-semibold text-sm">Tính năng nổi bật (Ngắn gọn)</label>
                                <textarea th:field="*{keyFeatures}" rows="3" class="border-gray-300 rounded-lg text-sm px-4 py-2.5"></textarea>
                            </div>
                            <div class="flex flex-col gap-1.5">
                                <label class="font-semibold text-sm">Mô tả chi tiết</label>
                                <textarea th:field="*{description}" rows="4" class="border-gray-300 rounded-lg text-sm px-4 py-2.5"></textarea>
                            </div>
                        </div>
                        
                        <div class="space-y-6">
                            <div class="flex flex-col gap-2 p-5 border border-orange-200 bg-orange-50 rounded-xl">
                                <label class="font-bold text-sm text-orange-700">Ảnh đại diện (Để trống nếu không đổi)</label>
                                <div class="mb-2 flex items-center gap-3">
                                    <img th:if="${laptop.imageUrl != null}" th:src="${laptop.imageUrl}" class="w-16 h-16 object-contain bg-white border rounded">
                                    <span class="text-xs text-orange-600 italic">Ảnh hiện tại</span>
                                </div>
                                <input name="mainImage" type="file" accept="image/*" class="text-sm file:mr-4 file:py-2.5 file:px-4 file:rounded-md file:border-0 file:bg-white file:text-orange-700 file:font-semibold hover:file:bg-gray-100 cursor-pointer"/>
                            </div>
                            <div class="flex flex-col gap-2 p-5 border border-blue-200 bg-blue-50 rounded-xl">
                                <label class="font-bold text-sm text-blue-700">Thêm Thư viện ảnh phụ (Gallery)</label>
                                <p class="text-xs text-blue-600 mb-1">Có thể chọn nhiều ảnh cùng lúc</p>
                                <input name="extraImages" type="file" multiple accept="image/*" class="text-sm file:mr-4 file:py-2.5 file:px-4 file:rounded-md file:border-0 file:bg-white file:text-blue-700 file:font-semibold hover:file:bg-gray-100 cursor-pointer"/>
                            </div>
                        </div>
                    </div>

                    <div class="pt-6 border-t border-gray-200 flex justify-end gap-4">
                        <a th:href="@{/admin/laptops}" class="px-6 py-2.5 border border-gray-300 text-gray-700 rounded-lg font-bold hover:bg-gray-50 transition">Hủy bỏ</a>
                        <button type="submit" class="px-8 py-2.5 bg-[#003f87] text-white rounded-lg font-bold hover:bg-blue-800 transition shadow-md">LƯU THAY ĐỔI</button>
                    </div>
                </form>

            </div>
        </div>
    </main>

</body>
</html>
