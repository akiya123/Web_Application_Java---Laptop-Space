<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sửa Danh mục - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8 text-gray-800">
    <div class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow-md">
        
        <div class="mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Cập nhật Danh Mục</h2>
        </div>

        <form th:action="@{/admin/categories/edit/{id}(id=${category.id})}" th:object="${category}" method="POST" class="space-y-4">
            
            <input type="hidden" th:field="*{id}" />

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Tên danh mục <span class="text-red-500">*</span></label>
                <input type="text" th:field="*{name}" required 
                       class="w-full px-4 py-2 border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Mô tả</label>
                <textarea th:field="*{description}" rows="4" 
                          class="w-full px-4 py-2 border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500"></textarea>
            </div>

            <div class="flex justify-end gap-3 mt-6">
                <a href="/admin/categories" class="px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400 transition">
                    Hủy bỏ
                </a>
                <button type="submit" class="px-4 py-2 bg-yellow-600 text-white rounded hover:bg-yellow-700 transition">
                    Cập nhật
                </button>
            </div>
        </form>

    </div>
</body>
</html>
