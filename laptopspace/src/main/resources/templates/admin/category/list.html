<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Danh mục - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden text-gray-800">

    <div th:replace="~{admin/fragments/sidebar :: sidebar('categories')}"></div>

    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="h-20 bg-white border-b border-gray-200 flex items-center justify-between px-8 shrink-0 shadow-sm">
            <h1 class="text-xl font-bold text-gray-800">Quản lý Danh mục</h1>
        </header>

        <div class="flex-1 overflow-y-auto p-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                
                <div class="md:col-span-1">
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 sticky top-0">
                        <h2 class="font-bold text-lg mb-4 border-b pb-2">Thêm Danh mục mới</h2>
                        <form th:action="@{/admin/categories/save}" method="POST" th:object="${newCategory}" class="flex flex-col gap-4">
                            <div>
                                <label class="text-sm font-semibold text-gray-600 block mb-1">Tên danh mục (Hãng/Loại)</label>
                                <input th:field="*{name}" required type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-[#003f87] focus:border-[#003f87]" placeholder="VD: Laptop Gaming, Dell, Asus..."/>
                            </div>
                            <button type="submit" class="bg-[#003f87] text-white font-bold py-2 rounded-lg hover:bg-blue-800 transition">Lưu Danh Mục</button>
                        </form>
                    </div>
                </div>

                <div class="md:col-span-2">
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 text-gray-600 text-sm uppercase tracking-wide border-b border-gray-200">
                                    <th class="p-4 font-semibold w-20">ID</th>
                                    <th class="p-4 font-semibold">Tên Danh mục</th>
                                    <th class="p-4 font-semibold text-right w-32">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody class="text-sm">
                                <tr th:each="cat : ${categories}" class="border-b border-gray-100 hover:bg-gray-50 transition">
                                    <td class="p-4 text-gray-500 font-medium" th:text="${cat.id}">1</td>
                                    <td class="p-4 font-bold text-[#003f87] text-base" th:text="${cat.name}">Tên DM</td>
                                    <td class="p-4 text-right">
                                        <a th:href="@{/admin/categories/delete/{id}(id=${cat.id})}" class="text-red-600 hover:underline font-medium flex items-center justify-end gap-1" onclick="return confirm('Xóa danh mục này có thể ảnh hưởng đến sản phẩm. Chắc chắn xóa?');">
                                            <span class="material-symbols-outlined text-[18px]">delete</span> Xóa
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(categories)}">
                                    <td colspan="3" class="p-8 text-center text-gray-500">Chưa có danh mục nào.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </main>

</body>
</html>
