<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <aside th:fragment="sidebar(activeMenu)" class="w-64 bg-[#001a40] text-white flex flex-col h-full flex-shrink-0 z-20">
        <div class="h-20 flex items-center justify-center border-b border-gray-700">
            <a th:href="@{/}" class="text-2xl font-black tracking-tight text-white">LaptopSpace<span class="text-[#fe6500]">.</span></a>
        </div>
        
        <nav class="flex-1 overflow-y-auto py-4">
            <ul class="space-y-1 px-3">
				<li>
				    <a th:href="@{/admin}" 
				       th:classappend="${activeMenu == 'dashboard' ? 'bg-[#003f87] text-white font-semibold shadow-sm' : 'text-gray-300 hover:text-white hover:bg-white/10'}"
				       class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors">
				        <span class="material-symbols-outlined">dashboard</span> Thống kê
				    </a>
				</li>
                <li>
                    <a th:href="@{/admin/orders}" 
                       th:classappend="${activeMenu == 'orders' ? 'bg-[#003f87] text-white font-semibold shadow-sm' : 'text-gray-300 hover:text-white hover:bg-white/10'}"
                       class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors">
                        <span class="material-symbols-outlined">receipt_long</span> Đơn hàng
                    </a>
                </li>
                <li>
                    <a th:href="@{/admin/laptops}" 
                       th:classappend="${activeMenu == 'laptops' ? 'bg-[#003f87] text-white font-semibold shadow-sm' : 'text-gray-300 hover:text-white hover:bg-white/10'}"
                       class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors">
                        <span class="material-symbols-outlined">laptop_mac</span> Sản phẩm
                    </a>
                </li>
				<li>
                    <a th:href="@{/admin/categories}" 
                       th:classappend="${activeMenu == 'categories' ? 'bg-[#003f87] text-white font-semibold shadow-sm' : 'text-gray-300 hover:text-white hover:bg-white/10'}"
                       class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors">
                        <span class="material-symbols-outlined">category</span> Danh mục
                    </a>
				</li>
				<li>
                    <a th:href="@{/admin/users}" 
                       th:classappend="${activeMenu == 'users' ? 'bg-[#003f87] text-white font-semibold shadow-sm' : 'text-gray-300 hover:text-white hover:bg-white/10'}"
                       class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors">
                        <span class="material-symbols-outlined">group</span> Khách hàng
                    </a>
			   </li>
			   <li>
			       <a th:href="@{/admin/promotions}" 
			          th:classappend="${activeMenu == 'promotions' ? 'bg-[#003f87] text-white font-semibold shadow-sm' : 'text-gray-300 hover:text-white hover:bg-white/10'}"
			          class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors">
			           <span class="material-symbols-outlined">local_offer</span> Khuyến mãi
			       </a>
			   </li>
            </ul>
        </nav>
        
        <div class="p-4 border-t border-gray-700">
            <a th:href="@{/logout}" class="flex items-center gap-3 px-4 py-2 text-gray-400 hover:text-red-400 transition-colors">
                <span class="material-symbols-outlined text-[20px]">logout</span> Đăng xuất
            </a>
        </div>
    </aside>
</body>
</html>
