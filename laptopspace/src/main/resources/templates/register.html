<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Đăng ký - LaptopSpace</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff", "error": "#ba1a1a", "surface-container-low": "#f3f4f5",
                        "secondary-fixed": "#ffdbcd", "secondary-container": "#fe6500", "on-primary-container": "#bbd0ff",
                        "on-tertiary-fixed-variant": "#7b2f00", "on-error-container": "#93000a", "primary-fixed": "#d7e2ff",
                        "tertiary-fixed": "#ffdbcc", "tertiary-container": "#983c00", "inverse-primary": "#acc7ff",
                        "on-tertiary-fixed": "#351000", "on-surface-variant": "#424752", "on-surface": "#191c1d",
                        "on-secondary": "#ffffff", "outline": "#727784", "on-background": "#191c1d", "surface-bright": "#f8f9fa",
                        "outline-variant": "#c2c6d4", "primary-fixed-dim": "#acc7ff", "on-secondary-fixed": "#360f00",
                        "on-primary-fixed-variant": "#004491", "tertiary": "#722b00", "tertiary-fixed-dim": "#ffb694",
                        "surface-variant": "#e1e3e4", "primary": "#003f87", "error-container": "#ffdad6", "background": "#f8f9fa",
                        "surface-container": "#edeeef", "on-primary": "#ffffff", "on-secondary-container": "#541d00",
                        "inverse-surface": "#2e3132", "secondary-fixed-dim": "#ffb596", "on-tertiary": "#ffffff",
                        "surface-tint": "#115cb9", "surface-container-highest": "#e1e3e4", "surface": "#f8f9fa",
                        "on-primary-fixed": "#001a40", "surface-container-high": "#e7e8e9", "primary-container": "#0056b3",
                        "inverse-on-surface": "#f0f1f2", "on-secondary-fixed-variant": "#7c2e00", "secondary": "#a33e00",
                        "surface-dim": "#d9dadb", "on-tertiary-container": "#ffc2a7", "on-error": "#ffffff"
                    },
                    "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" },
                    "spacing": { "margin-desktop": "48px", "stack-xs": "4px", "margin-mobile": "16px", "stack-md": "16px", "stack-xl": "48px", "stack-sm": "8px", "gutter": "24px", "stack-lg": "24px", "container-max": "1240px" },
                    "fontFamily": { "display-lg": ["Inter", "sans-serif"], "body-sm": ["Inter", "sans-serif"], "body-md": ["Inter", "sans-serif"], "headline-lg-mobile": ["Inter", "sans-serif"], "label-md": ["Inter", "sans-serif"], "headline-md": ["Inter", "sans-serif"], "headline-sm": ["Inter", "sans-serif"], "headline-lg": ["Inter", "sans-serif"], "label-lg": ["Inter", "sans-serif"], "body-lg": ["Inter", "sans-serif"], "price-lg": ["Inter", "sans-serif"] },
                    "fontSize": { "display-lg": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }], "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }], "headline-lg-mobile": ["24px", { "lineHeight": "1.3", "fontWeight": "700" }], "label-md": ["12px", { "lineHeight": "1", "fontWeight": "500" }], "headline-md": ["24px", { "lineHeight": "1.4", "fontWeight": "600" }], "headline-sm": ["20px", { "lineHeight": "1.4", "fontWeight": "600" }], "headline-lg": ["32px", { "lineHeight": "1.3", "fontWeight": "700" }], "label-lg": ["14px", { "lineHeight": "1", "fontWeight": "600" }], "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }], "price-lg": ["24px", { "lineHeight": "1", "fontWeight": "700" }] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">

    <main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop">
        <div class="bg-surface-container-lowest rounded-xl shadow-[0px_8px_24px_rgba(0,0,0,0.12)] w-full max-w-md p-stack-lg border border-surface-variant">
            
            <div class="text-center mb-stack-lg">
                <h1 class="font-display-lg text-headline-lg-mobile md:text-headline-lg text-primary font-bold mb-stack-sm">LaptopSpace</h1>
                <h2 class="font-headline-md text-headline-md text-on-surface">Tạo tài khoản mới</h2>
            </div>

            <div th:if="${error}" class="bg-red-100 text-red-700 p-3 rounded-lg mb-4 text-sm text-center font-medium" th:text="${error}"></div>

            <form th:action="@{/register}" th:object="${user}" method="POST" class="space-y-stack-md">
                
                <div>
                    <label class="block font-label-lg text-label-lg text-on-surface-variant mb-stack-xs" for="fullname">Họ và tên</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
                            <span class="material-symbols-outlined text-xl">person</span>
                        </div>
                        <input th:field="*{fullName}" class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface transition-colors duration-200" id="fullname" placeholder="Nhập họ và tên của bạn" required type="text"/>
                    </div>
                </div>

                <div>
                    <label class="block font-label-lg text-label-lg text-on-surface-variant mb-stack-xs" for="email">Email</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
                            <span class="material-symbols-outlined text-xl">mail</span>
                        </div>
                        <input th:field="*{email}" class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface transition-colors duration-200" id="email" placeholder="Nhập địa chỉ email" required type="email"/>
                    </div>
                </div>

                <div>
                    <label class="block font-label-lg text-label-lg text-on-surface-variant mb-stack-xs" for="phone">Số điện thoại</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
                            <span class="material-symbols-outlined text-xl">call</span>
                        </div>
                        <input th:field="*{phone}" class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface transition-colors duration-200" id="phone" placeholder="Nhập số điện thoại" required type="tel"/>
                    </div>
                </div>

                <div>
                    <label class="block font-label-lg text-label-lg text-on-surface-variant mb-stack-xs" for="password">Mật khẩu</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
                            <span class="material-symbols-outlined text-xl">lock</span>
                        </div>
                        <input th:field="*{password}" class="block w-full pl-10 pr-10 py-3 border border-outline-variant rounded-lg bg-surface focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface transition-colors duration-200" id="password" placeholder="Nhập mật khẩu" required type="password"/>
                    </div>
                </div>

                <div>
                    <label class="block font-label-lg text-label-lg text-on-surface-variant mb-stack-xs" for="confirm_password">Xác nhận mật khẩu</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
                            <span class="material-symbols-outlined text-xl">lock_reset</span>
                        </div>
                        <input class="block w-full pl-10 pr-10 py-3 border border-outline-variant rounded-lg bg-surface focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface transition-colors duration-200" id="confirm_password" name="confirmPassword" placeholder="Nhập lại mật khẩu" required type="password"/>
                    </div>
                </div>

                <div class="flex items-start">
                    <div class="flex items-center h-5">
                        <input class="focus:ring-primary h-4 w-4 text-primary border-outline-variant rounded cursor-pointer" id="terms" required type="checkbox"/>
                    </div>
                    <div class="ml-3 font-body-sm text-body-sm">
                        <label class="text-on-surface-variant" for="terms">Tôi đồng ý với <a class="font-bold text-primary hover:text-primary-container transition-colors" href="#">Điều khoản dịch vụ</a>.</label>
                    </div>
                </div>

                <div class="pt-stack-xs">
                    <button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-lg text-label-lg font-bold text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200 active:scale-95" type="submit">
                        Đăng ký
                    </button>
                </div>
            </form>

            <div class="mt-stack-lg text-center font-body-md text-body-md">
                <p class="text-on-surface-variant">Đã có tài khoản? 
                    <a class="font-bold text-primary hover:text-primary-container hover:underline transition-all" th:href="@{/login}">Đăng nhập</a>
                </p>
            </div>
        </div>
    </main>

</body>
</html>
