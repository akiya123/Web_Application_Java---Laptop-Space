<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Lịch sử mua hàng - LaptopSpace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style> body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; } </style>
</head>
<body class="flex flex-col min-h-screen text-gray-800">

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="max-w-[1000px] mx-auto px-4 py-12 flex-grow w-full">
        <div class="flex items-center gap-3 mb-8">
            <span class="material-symbols-outlined text-4xl text-[#003f87]">receipt_long</span>
            <h1 class="text-3xl font-black text-gray-900">Đơn hàng của tôi</h1>
        </div>

        <div th:if="${#lists.isEmpty(orders)}" class="bg-white rounded-2xl p-12 text-center border border-gray-200 shadow-sm">
            <span class="material-symbols-outlined text-6xl text-gray-300 mb-4">shopping_bag</span>
            <h3 class="text-xl font-bold text-gray-800">Bạn chưa có đơn hàng nào</h3>
            <p class="text-gray-500 mt-2">Hãy dạo quanh cửa hàng và chọn cho mình sản phẩm ưng ý nhé.</p>
            <a th:href="@{/shop}" class="inline-block mt-6 px-8 py-3 bg-[#003f87] text-white rounded-xl font-bold hover:bg-blue-800 transition">Tiếp tục mua sắm</a>
        </div>

        <div th:unless="${#lists.isEmpty(orders)}" class="space-y-6">
            <div th:each="order : ${orders}" class="bg-white rounded-2xl p-6 border border-gray-200 shadow-sm hover:shadow-md transition">
                <div class="flex flex-col md:flex-row md:items-center justify-between border-b border-gray-100 pb-4 mb-4 gap-4">
                    <div>
                        <p class="text-sm font-bold text-gray-500 mb-1" th:text="'Đơn hàng #' + ${order.id}"></p>
                        <p class="text-xs text-gray-400" th:text="${order.orderDate != null ? #temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm') : ''}"></p>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="px-3 py-1 rounded-full text-xs font-bold border"
                              th:classappend="${order.status == 'Chờ xác nhận' or order.status == 'CHỜ XÁC NHẬN' ? 'bg-blue-50 text-blue-700 border-blue-200' : 
                                               (order.status == 'Hoàn thành' or order.status == 'HOÀN THÀNH' ? 'bg-green-50 text-green-700 border-green-200' : 
                                               (order.status == 'Đã hủy' ? 'bg-red-50 text-red-700 border-red-200' : 'bg-orange-50 text-orange-700 border-orange-200'))}"
                              th:text="${order.status}">
                            Trạng thái
                        </span>
                        <a th:href="@{/user/orders/{id}(id=${order.id})}" class="text-sm font-bold text-[#003f87] hover:underline">Xem chi tiết &rarr;</a>
                    </div>
                </div>

                <div class="flex justify-between items-end mt-4 pt-4">
                    <p class="text-sm text-gray-500 font-medium">Tổng tiền:</p>
                    <p class="text-xl font-black text-[#ba1a1a]" th:text="${#numbers.formatInteger(order.totalAmount, 3, 'POINT')} + ' ₫'"></p>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
