<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Chi tiết đơn hàng - LaptopSpace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style> body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; } </style>
</head>
<body class="flex flex-col min-h-screen text-gray-800">

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="max-w-[1000px] mx-auto px-4 py-12 flex-grow w-full">
        
        <a th:href="@{/user/orders}" class="inline-flex items-center gap-2 text-sm font-medium text-gray-500 hover:text-[#003f87] mb-6 transition">
            <span class="material-symbols-outlined text-[18px]">arrow_back</span> Quay lại danh sách
        </a>

        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
            <div>
                <h1 class="text-2xl font-black text-gray-900" th:text="'Chi tiết đơn hàng #' + ${order.id}"></h1>
                <p class="text-sm text-gray-500 mt-1" th:text="'Ngày đặt: ' + ${order.orderDate != null ? #temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm') : ''}"></p>
            </div>
            
            <div class="flex items-center gap-4">
                <span class="px-4 py-1.5 rounded-full text-sm font-bold border"
                      th:classappend="${order.status == 'Chờ xác nhận' or order.status == 'CHỜ XÁC NHẬN' ? 'bg-blue-50 text-blue-700 border-blue-200' : 
                                       (order.status == 'Hoàn thành' or order.status == 'HOÀN THÀNH' ? 'bg-green-50 text-green-700 border-green-200' : 
                                       (order.status == 'Đã hủy' ? 'bg-red-50 text-red-700 border-red-200' : 'bg-orange-50 text-orange-700 border-orange-200'))}"
                      th:text="${order.status}">
                </span>
                
                <form th:if="${order.status == 'Chờ xác nhận' or order.status == 'CHỜ XÁC NHẬN'}" 
                      th:action="@{/user/orders/{id}/cancel(id=${order.id})}" method="POST"
                      onsubmit="return confirm('Bạn có chắc chắn muốn hủy đơn hàng này không? Quá trình này không thể hoàn tác.');">
                    <button type="submit" class="px-4 py-1.5 bg-white border-2 border-red-500 text-red-500 rounded-lg font-bold text-sm hover:bg-red-50 transition">
                        Hủy đơn hàng
                    </button>
                </form>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="md:col-span-2 space-y-6">
                <div class="bg-white rounded-2xl border border-gray-200 p-6 shadow-sm">
                    <h2 class="font-bold text-lg border-b border-gray-100 pb-4 mb-4">Sản phẩm đã mua</h2>
                    
                    <div class="space-y-6">
						<div th:each="detail : ${order.orderDetails}" class="flex flex-col gap-4 border-b border-gray-100 pb-6 last:border-0 last:pb-0">
                            
                            <div class="flex gap-4">
                                <div class="w-20 h-20 bg-gray-50 rounded-lg p-2 border border-gray-100 shrink-0 flex items-center justify-center">
                                    <img th:src="${detail.laptop.imageUrl}" class="w-full h-full object-contain">
                                </div>
                                <div class="flex-1">
                                    <a th:href="@{/laptop/{id}(id=${detail.laptop.id})}" class="font-bold text-[#003f87] hover:underline text-sm line-clamp-2" th:text="${detail.laptop.name}">Tên Laptop</a>
                                    
                                    <div class="flex flex-wrap gap-2 mt-1.5 mb-2">
                                        <span th:if="${detail.laptop.cpu != null}" th:text="${detail.laptop.cpu}" class="text-[10px] bg-gray-100 text-gray-600 px-2 py-0.5 rounded border border-gray-200"></span>
                                        <span th:if="${detail.laptop.ram != null}" th:text="${detail.laptop.ram}" class="text-[10px] bg-gray-100 text-gray-600 px-2 py-0.5 rounded border border-gray-200"></span>
                                        <span th:if="${detail.laptop.storage != null}" th:text="${detail.laptop.storage}" class="text-[10px] bg-gray-100 text-gray-600 px-2 py-0.5 rounded border border-gray-200"></span>
                                        <span th:if="${detail.laptop.vga != null}" th:text="${detail.laptop.vga}" class="text-[10px] bg-gray-100 text-gray-600 px-2 py-0.5 rounded border border-gray-200"></span>
                                    </div>

                                    <div class="flex justify-between items-center mt-auto">
                                        <span class="text-xs text-gray-500 font-medium" th:text="'Số lượng: ' + ${detail.quantity}">SL: 1</span>
                                        <span class="font-bold text-gray-800" th:text="${#numbers.formatInteger(detail.price, 3, 'POINT')} + ' ₫'"></span>
                                    </div>
                                </div>
                            </div>

                            <div th:if="${order.status == 'Hoàn thành' or order.status == 'HOÀN THÀNH'}" class="pl-24">
                                
                                <div th:if="${reviewedLaptopIds != null and #lists.contains(reviewedLaptopIds, detail.laptop.id)}" class="flex items-center gap-1.5 text-sm font-bold text-[#198754] bg-green-50 p-2.5 rounded-lg border border-green-200 w-max">
                                    <span class="material-symbols-outlined text-[18px]">check_circle</span> Đã gửi đánh giá
                                </div>

                                <form th:unless="${reviewedLaptopIds != null and #lists.contains(reviewedLaptopIds, detail.laptop.id)}" 
                                      th:action="@{/review/add}" method="POST" class="bg-blue-50/50 p-3.5 rounded-xl border border-blue-100 flex flex-col gap-3 relative">
                                    
                                    <input type="hidden" name="laptopId" th:value="${detail.laptop.id}">
                                    <p class="text-[13px] font-bold text-[#003f87]">Viết đánh giá cho sản phẩm này:</p>
                                    
                                    <div class="flex flex-col md:flex-row gap-2">
                                        <select name="rating" class="border border-gray-300 rounded-lg px-2 py-2 text-xs outline-none focus:border-[#003f87] w-full md:w-28 shrink-0 bg-white">
                                            <option value="5">5 Sao</option>
                                            <option value="4">4 Sao</option>
                                            <option value="3">3 Sao</option>
                                            <option value="2">2 Sao</option>
                                            <option value="1">1 Sao</option>
                                        </select>
                                        <input type="text" name="comment" required placeholder="Nhận xét của bạn..." class="border border-gray-300 rounded-lg px-3 py-2 text-xs outline-none focus:border-[#003f87] flex-1 bg-white">
                                        <button type="submit" class="bg-[#003f87] text-white px-4 py-2 rounded-lg font-bold text-xs hover:bg-blue-800 transition shrink-0 shadow-sm">Gửi ngay</button>
                                    </div>
                                </form>

                            </div>

						</div>
                    </div>
                    
                    <div class="border-t border-gray-100 mt-6 pt-4 flex justify-between items-center">
                        <span class="font-bold text-gray-600">Tổng cộng:</span>
                        <span class="text-2xl font-black text-[#ba1a1a]" th:text="${#numbers.formatInteger(order.totalAmount, 3, 'POINT')} + ' ₫'"></span>
                    </div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="bg-white rounded-2xl border border-gray-200 p-6 shadow-sm">
                    <h2 class="font-bold text-lg border-b border-gray-100 pb-4 mb-4 flex items-center gap-2">
                        <span class="material-symbols-outlined text-[#fe6500]">local_shipping</span> Thông tin nhận hàng
                    </h2>
                    <div class="space-y-3 text-sm">
                        <p><span class="text-gray-500">Người nhận:</span> <br> <strong class="text-gray-800" th:text="${order.customerName}"></strong></p>
                        <p><span class="text-gray-500">Số điện thoại:</span> <br> <strong class="text-gray-800" th:text="${order.customerPhone}"></strong></p>
                        <p><span class="text-gray-500">Địa chỉ giao:</span> <br> <span class="text-gray-800" th:text="${order.shippingAddress}"></span></p>
                        <div th:if="${order.note != null and !order.note.isEmpty()}">
                            <span class="text-gray-500">Ghi chú:</span> <br> <span class="text-gray-600 italic" th:text="${order.note}"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
