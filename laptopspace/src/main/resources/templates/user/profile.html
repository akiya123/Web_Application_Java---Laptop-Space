<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Thông tin cá nhân - LaptopSpace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style> body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; } </style>
</head>
<body class="flex flex-col min-h-screen text-gray-800">

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="max-w-[1000px] mx-auto px-4 py-12 flex-grow w-full">
        <div class="mb-8">
            <h1 class="text-3xl font-black text-gray-900">Quản lý Tài khoản</h1>
        </div>

        <div th:if="${msg_success}" class="mb-6 p-4 bg-green-50 text-green-700 border border-green-200 rounded-xl flex items-center gap-2">
            <span class="material-symbols-outlined">check_circle</span> <span th:text="${msg_success}"></span>
        </div>
        <div th:if="${msg_error}" class="mb-6 p-4 bg-red-50 text-red-700 border border-red-200 rounded-xl flex items-center gap-2">
            <span class="material-symbols-outlined">error</span> <span th:text="${msg_error}"></span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
                <h2 class="font-bold text-lg border-b pb-3 mb-4 text-[#003f87] flex items-center gap-2">
                    <span class="material-symbols-outlined">person</span> Thông tin cá nhân
                </h2>
                <form th:action="@{/user/profile/update}" method="POST" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Email / Tên đăng nhập (Không thể đổi)</label>
                        <input type="text" th:value="${user.email}" disabled class="w-full border border-gray-300 bg-gray-100 rounded-lg px-4 py-2.5 text-gray-500">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Họ và tên</label>
                        <input type="text" name="fullName" th:value="${user.fullName}" required class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-[#003f87]">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Số điện thoại</label>
                        <input type="text" name="phone" th:value="${user.phone}" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-[#003f87]">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Địa chỉ giao hàng mặc định</label>
                        <textarea name="address" rows="3" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-[#003f87]" th:text="${user.address}"></textarea>
                    </div>
                    <button type="submit" class="w-full py-3 bg-[#003f87] text-white font-bold rounded-xl hover:bg-blue-800 transition">Lưu Thông Tin</button>
                </form>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
                <h2 class="font-bold text-lg border-b pb-3 mb-4 text-[#ba1a1a] flex items-center gap-2">
                    <span class="material-symbols-outlined">lock</span> Đổi mật khẩu
                </h2>
                <form th:action="@{/user/profile/change-password}" method="POST" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Mật khẩu hiện tại</label>
                        <input type="password" name="oldPassword" required class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-red-500">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Mật khẩu mới</label>
                        <input type="password" name="newPassword" required minlength="6" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-red-500">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Xác nhận mật khẩu mới</label>
                        <input type="password" name="confirmPassword" required minlength="6" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-red-500">
                    </div>
                    <button type="submit" class="w-full py-3 bg-white border-2 border-red-500 text-red-600 font-bold rounded-xl hover:bg-red-50 transition">Cập Nhật Mật Khẩu</button>
                </form>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
