# Web server
server.port=8081

# SQL Server
spring.datasource.url=jdbc:sqlserver://192.168.1.2:1433;databaseName=laptopspace_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Hoan1252005@
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
